<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mürekkep</title>

    <meta name="description" content="Bazı şeyler yazılınca hafifler.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Mürekkep">
    <meta property="og:description" content="Bazı şeyler yazılınca hafifler.">
    <meta property="og:url" content="https://ysenguloglu.github.io/">
    <meta property="og:site_name" content="Mürekkep">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Mürekkep">
    <meta name="twitter:description" content="Bazı şeyler yazılınca hafifler.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <a href="./" class="logo">Mürekkep</a>

            <nav>
                <a href="#siirler">yazılar</a>
                <a href="#hakkimda">hakkımda</a>
            </nav>
        </header>


        <section class="hero">

            <p class="eyebrow">Mürekkep</p>

            <h1>
                Bazen insan,<br>
                söyleyemediğini yazar.
            </h1>

        </section>


        <section id="siirler" class="poems">

            <div class="section-title">
                <span>yazılar</span>
                <span id="poem-count"></span>
            </div>

            <div id="poem-list"></div>

        </section>


        <section id="poem-view" class="poem-view hidden">

            <button id="back-button">← yazılar</button>

            <article>

                <p class="poem-date" id="poem-date"></p>

                <h2 id="poem-title"></h2>

                <div id="poem-content" class="poem-content"></div>

            </article>

            <div class="poem-navigation">

                <button id="previous-button">← önceki</button>

                <button id="next-button">sonraki →</button>

            </div>

        </section>


        <section id="hakkimda" class="about">

            <div class="section-title">
                <span>hakkımda</span>
            </div>

            <p>
                Şiir yazıyorum.
                Gerisini burada bıraktım.
            </p>

        </section>


        <footer>
            <span>© 2026 Yavuz Şengüloğlu</span>
            <span>INSTAGRAM/@yavuzdurden</span>
        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
